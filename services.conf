#!/usr/bin/env bash
# G2Rain deploy service mapping (bash-only, no python required)
#
# Format:
#   Each entry in SERVICES is: "repo|dir|compose_service|build_cmd"
#
# Notes:
# - repo: GitHub repo name under GIT_BASE
# - dir:  directory name under CODES_DIR (usually same as repo)
# - compose_service: service name in docker-compose.yml
# - build_cmd: command executed inside the repo directory to build the image
#   显式指定 compose 期望的镜像 g2rain/<repo>:latest（各项目 build.sh 默认发布到 ghcr.io，测试环境本地构建需覆盖）
#   Java 服务：APP_IMAGE=g2rain/<repo> ./build.sh latest；要求 tag 等于 Maven 版本的项目（gateway-webflux、cms、member、agent-runtime、model-nexus）改用 EXTRA_TAGS=latest 追加 latest 标签；前端：./build.sh --image g2rain/<repo> --tag latest

set -euo pipefail

# Where repos are checked out (relative to g2rain-deploy root)
CODES_DIR="./codes"

# GitHub base for cloning/pulling (can be overridden by env: G2RAIN_GIT_BASE)
GIT_BASE_DEFAULT="https://github.com/g2rain"

SERVICES=(
  "g2rain-infra|g2rain-infra|g2rain-infra|APP_IMAGE=g2rain/g2rain-infra ./build.sh latest"
  "g2rain-basis|g2rain-basis|g2rain-basis|APP_IMAGE=g2rain/g2rain-basis ./build.sh latest"
  "g2rain-iam|g2rain-iam|g2rain-iam|APP_IMAGE=g2rain/g2rain-iam ./build.sh latest"
  # repo != compose service (image built from g2rain-gateway-webflux, service is g2rain-gateway)
  "g2rain-gateway-webflux|g2rain-gateway-webflux|g2rain-gateway|APP_IMAGE=g2rain/g2rain-gateway-webflux EXTRA_TAGS=latest ./build.sh"
  "g2rain-cms|g2rain-cms|g2rain-cms|APP_IMAGE=g2rain/g2rain-cms EXTRA_TAGS=latest ./build.sh"
  "g2rain-infra-app|g2rain-infra-app|g2rain-infra-app|./build.sh --image g2rain/g2rain-infra-app --tag latest"
  "g2rain-manager-app|g2rain-manager-app|g2rain-manager-app|./build.sh --image g2rain/g2rain-manager-app --tag latest"
  "g2rain-cms-app|g2rain-cms-app|g2rain-cms-app|./build.sh --image g2rain/g2rain-cms-app --tag latest"
  "g2rain-main-shell|g2rain-main-shell|g2rain-main-shell|./build.sh --image g2rain/g2rain-main-shell --tag latest"
  "g2rain-admin-shell|g2rain-admin-shell|g2rain-admin-shell|./build.sh --image g2rain/g2rain-admin-shell --tag latest"
  "g2rain-chat-shell|g2rain-chat-shell|g2rain-chat-shell|./build.sh --image g2rain/g2rain-chat-shell --tag latest"
  "g2rain-department-app|g2rain-department-app|g2rain-department-app|./build.sh --image g2rain/g2rain-department-app --tag latest"
  "g2rain-member-app|g2rain-member-app|g2rain-member-app|./build.sh --image g2rain/g2rain-member-app --tag latest"
  "g2rain-department|g2rain-department|g2rain-department|APP_IMAGE=g2rain/g2rain-department ./build.sh latest"
  "g2rain-member|g2rain-member|g2rain-member|APP_IMAGE=g2rain/g2rain-member EXTRA_TAGS=latest ./build.sh"
  "g2rain-knowledge|g2rain-knowledge|g2rain-knowledge|APP_IMAGE=g2rain/g2rain-knowledge ./build.sh latest"
  "g2rain-knowledge-app|g2rain-knowledge-app|g2rain-knowledge-app|./build.sh --image g2rain/g2rain-knowledge-app --tag latest"
  "g2rain-agent-app|g2rain-agent-app|g2rain-agent-app|./build.sh --image g2rain/g2rain-agent-app --tag latest"
  "g2rain-agent-runtime|g2rain-agent-runtime|g2rain-agent-runtime|APP_IMAGE=g2rain/g2rain-agent-runtime EXTRA_TAGS=latest ./build.sh"
  "g2rain-agent-studio|g2rain-agent-studio|g2rain-agent-studio|APP_IMAGE=g2rain/g2rain-agent-studio ./build.sh latest"
  "g2rain-mcp-registry|g2rain-mcp-registry|g2rain-mcp-registry|APP_IMAGE=g2rain/g2rain-mcp-registry ./build.sh latest"
  "g2rain-model-nexus|g2rain-model-nexus|g2rain-model-nexus|APP_IMAGE=g2rain/g2rain-model-nexus EXTRA_TAGS=latest ./build.sh"
)

