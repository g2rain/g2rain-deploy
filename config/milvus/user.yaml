common:
  security:
    authorizationEnabled: true

# Demo/low-concurrency: default flushRate max=0.1 causes publish (multi-upsert) to stall and fail HTTP.
quotaAndLimits:
  flushRate:
    max: 2

mq:
  type: woodpecker

woodpecker:
  storage:
    type: local
    rootPath: /var/lib/milvus/woodpecker
